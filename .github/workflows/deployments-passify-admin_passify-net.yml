# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PASSIFY ASP.Net ADMIN APP TO AZURE

on:
  push:
    branches:
      - deployments/PASSIFY-ADMIN
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C562DD64EC3D4B04BEABD3BCA2DA4AC8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B68C683FBA2C4CA4A470F77B73117E75 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A8EE00603A4444B99E1258549C9D270F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'passify-net'
          slot-name: 'Production'
          package: .
  
  pull-req:
    permissions:
      pull-requests: write
      contents: write
    needs: [ build, deploy ]
    name: Create and Merge Pull Request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: gh -h

      - name: Create Pull Request for ${{ github.ref_name }} and merge into master
        run: |
          BRANCH="${{ github.ref_name }}"
          
          # Create PR if it doesn't exist
          pr_url=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Automated Pull Request" \
            --body "This PR was created and merged automatically by GitHub Actions." \
            2>/dev/null || \
            gh pr list \
              --head "$BRANCH" \
              --base master \
              --json url \
              --jq '.[0].url')
          
          if [ -n "$pr_url" ]; then
            echo "PR URL: $pr_url"
            gh pr merge "$pr_url" --merge --auto
          else
            echo "No PR created or found."
          fi